<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario SVM Predictor</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 40px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .flex-box { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; }
        .form-side { flex: 1; min-width: 280px; }
        .plot-side { flex: 1.2; text-align: center; min-width: 320px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background-color: #3498db; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #2980b9; }
        .alerta { padding: 15px; border-radius: 6px; font-weight: bold; margin-top: 20px; text-align: center; }
        .aprobado { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .reprobado { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<div class="container">
    <h1>Predicción de Alumnos con Clasificador SVM</h1>
    
    <div class="flex-box">
        <!-- Formulario Izquierda -->
        <div class="form-side">
            <form method="POST">
                <div class="form-group">
                    <label for="horas">Horas de Estudio Semanales:</label>
                    <input type="number" id="horas" name="horas" min="0" max="24" step="0.5" required placeholder="Ej: 12">
                </div>
                <div class="form-group">
                    <label for="asistencia">% de Asistencia a Clase:</label>
                    <input type="number" id="asistencia" name="asistencia" min="0" max="100" required placeholder="Ej: 85">
                </div>
                <button type="submit">Enviar al Modelo SVM</button>
            </form>

            <!-- Bloque de respuesta dinámica -->
            {% if resultado %}
                <div class="alerta {{ clase_css }}">
                    {{ resultado }}
                </div>
            {% endif %}
        </div>

        <!-- Renderizado de Gráfica Derecha -->
        <div class="plot-side">
            <h3>Visualización en Tiempo Real</h3>
            <!-- Aquí el HTML lee directamente la cadena Base64 inyectada por Flask -->
            <img src="{{ grafica }}" alt="Gráfica de Vectores de Soporte SVM">
        </div>
    </div>
</div>

</body>
</html>
